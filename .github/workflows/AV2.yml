name: AVM Codec Windows Build CI

on:
  push:
    branches: [ main, av2-enc ]
  pull_request:
    branches: [ main, av2-enc ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install assembler dependency manually
      run: |
        $ToolsDir = Join-Path $env:USERPROFILE "tools"
        New-Item -ItemType Directory -Force -Path $ToolsDir
        Invoke-WebRequest -Uri "https://tortall.net" -OutFile "$ToolsDir\yasm.exe"
        echo "$ToolsDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # 1. Fetch the target codebase into a clean alphanumeric subdirectory structure
    - name: Fetch Target Codebase cleanly
      uses: actions/checkout@v4
      with:
        repository: 'AOMediaCodec/avm'
        ref: 'main'
        path: 'wspace/csrc'
        submodules: 'recursive'

    # 2. Configure and build while completely stripping Git tracking configurations
    - name: Configure and Build AVM
      run: |
        # Force remove the underlying .git meta folders to completely hide the upstream "AOMediaCodec/avm" remote tracking string name
        Remove-Item -Path "$env:GITHUB_WORKSPACE\wspace\csrc\.git" -Recurse -Force -ErrorAction SilentlyContinue
        
        $AbsoluteSrcPath = "$env:GITHUB_WORKSPACE\wspace\csrc"
        $AbsoluteBuildPath = "$env:TEMP\cbuild"
        New-Item -ItemType Directory -Force -Path $AbsoluteBuildPath
        
        Write-Output "Configuring project with CMake..."
        cmake -S "$AbsoluteSrcPath" -B "$AbsoluteBuildPath" -G "Visual Studio 17 2022" -A x64 -DPYTHON_EXECUTABLE="$env:pythonLocation\python.exe" -DENABLE_DOCS=0
        
        Write-Output "Compiling production targets..."
        cmake --build "$AbsoluteBuildPath" --config Release --parallel
        
        # Safe staging loop to move completed executables back to the repository workspace
        $BinariesDir = "$env:GITHUB_WORKSPACE\wspace\cbin"
        New-Item -ItemType Directory -Force -Path $BinariesDir
        if (Test-Path "$AbsoluteBuildPath\Release\avmenc.exe") {
            Copy-Item "$AbsoluteBuildPath\Release\avmenc.exe" -Destination "$BinariesDir\"
            Copy-Item "$AbsoluteBuildPath\Release\avmdec.exe" -Destination "$BinariesDir\"
        }

    # 3. Target the staged layout directory path natively for artifact uploading
    - name: Upload Compiled Binaries
      uses: actions/upload-artifact@v4
      with:
        name: nextgen-windows-x64-binaries
        path: wspace/cbin/
